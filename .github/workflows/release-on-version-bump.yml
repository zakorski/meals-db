name: Auto Bump Version, Build Plugin Zip and Release

# Default the workflow to read-only; each job grants itself the exact
# scopes it needs. Any future job we add inherits no more than
# contents: read until we opt in explicitly.
permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    # This job pushes a version-bump commit, pushes a tag, and creates a
    # GitHub Release — all of which require contents: write.
    permissions:
      contents: write
    steps:
      # Third-party actions are pinned to a full commit SHA rather than
      # a mutable tag. A tag-hijack on either maintainer's repo would
      # otherwise run attacker-controlled code inside this job with the
      # scoped GITHUB_TOKEN (contents: write). Dependabot will PR SHA
      # bumps weekly via .github/dependabot.yml.
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      # ------------------------------------------------------------------
      # 1️⃣ Get latest valid tag (vX.Y.Z)
      # ------------------------------------------------------------------
      - name: Get current tag
        id: get_tag
        run: |
          latest_tag=$(git tag -l "v[0-9]*" --sort=-v:refname | head -n 1)
          if [ -z "$latest_tag" ]; then latest_tag="v1.0.0"; fi
          echo "latest_tag=${latest_tag}" >> $GITHUB_ENV
          echo "Detected latest tag: ${latest_tag}"

      # ------------------------------------------------------------------
      # 2️⃣ Calculate next patch version
      # ------------------------------------------------------------------
      - name: Calculate next version
        id: next_version
        run: |
          version=${latest_tag#v}
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          new_version="${major}.${minor}.${patch}"
          echo "new_version=${new_version}" >> $GITHUB_ENV
          echo "Next version: $new_version"

           # ------------------------------------------------------------------
      # 3️⃣ Update plugin header version (super-robust)
      # ------------------------------------------------------------------
      - name: Update plugin header version
        run: |
          file="meals-db-main.php"
          echo "🔧 Updating version in $file to $new_version"
          dos2unix "$file" || true

          # Match optional spaces or asterisks before "Version:"
          sed -i -E "s/^[[:space:]]*(\*[[:space:]]*)?Version:[[:space:]]*[0-9.]+/ * Version: ${new_version}/I" "$file"

          echo "✅ Resulting version line:"
          grep -i "Version:" "$file" | head -n 1 || echo "⚠️ No Version line found"

          git add "$file"
          git diff --cached || true
          git commit -m "chore: bump plugin version to ${new_version}" || echo "No changes to commit"

      # ------------------------------------------------------------------
      # 4️⃣ Create and push tag
      # ------------------------------------------------------------------
      - name: Create Git tag
        id: tag
        run: |
          git tag -a "v${new_version}" -m "Release v${new_version}"
          git push origin "v${new_version}"
          git push

      # ------------------------------------------------------------------
      # 5️⃣ Build plugin zip with correct root folder
      # ------------------------------------------------------------------
      - name: Build plugin zip
        id: build
        run: |
          mkdir build
          mkdir build/meals-db-main
          rsync -av --exclude='.git' --exclude='build' --exclude='.github' ./ build/meals-db-main/
          cd build
          zip -r meals-db-main.zip meals-db-main
          cd ..

      # ------------------------------------------------------------------
      # 5️⃣b Compute the asset checksum.
      #
      # The plugin's update path verifies the downloaded archive against a
      # "SHA256: <hex>" line in the release notes before installing it
      # (plugin-update-checker upgrader_pre_download gate; MealsDB_Updates
      # release path). Without this line the updater refuses the release
      # unless MEALSDB_ALLOW_UNVERIFIED_RELEASE is set. The hash MUST be of
      # the exact asset we attach below (meals-db-main.zip), which is what
      # the native updater downloads.
      # ------------------------------------------------------------------
      - name: Compute zip SHA-256
        id: checksum
        run: |
          sha256=$(sha256sum build/meals-db-main.zip | awk '{print $1}')
          echo "zip_sha256=${sha256}" >> "$GITHUB_ENV"
          echo "🔐 meals-db-main.zip SHA256: ${sha256}"

      # ------------------------------------------------------------------
      # 6️⃣ Create GitHub Release and attach zip
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ env.new_version }}
          name: "Release v${{ env.new_version }}"
          body: |
            Automated release for version v${{ env.new_version }}.

            SHA256: ${{ env.zip_sha256 }}
          files: build/meals-db-main.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 7️⃣ Rollback safeguard — runs if any previous step fails
      # ------------------------------------------------------------------
      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Build or release failed. Rolling back tag and release..."
          git push --delete origin "v${new_version}" || true
          git tag -d "v${new_version}" || true

          # Delete the draft release from GitHub (if it was created)
          release_id=$(gh api repos/${{ github.repository }}/releases/tags/v${new_version} --jq '.id' || true)
          if [ -n "$release_id" ]; then
            gh api repos/${{ github.repository }}/releases/$release_id -X DELETE || true
            echo "🧹 Deleted incomplete GitHub release ID $release_id"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
