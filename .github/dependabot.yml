# Keep the pinned action SHAs in .github/workflows/* up to date. Without
# this, the commit-SHA pinning we use for supply-chain safety would
# silently rot against upstream security fixes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
  # Watch composer.json/composer.lock so dompdf-family advisories (the package
  # has a long RCE/SSRF/LFI history) produce update PRs instead of arriving
  # silently. NOTE: vendor/ is committed to this repo, so a Dependabot composer
  # PR bumps composer.lock but NOT vendor/ — after merging one you must run
  # `composer install` locally and re-commit the regenerated vendor/ tree, or
  # the deployed code will not actually change.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - composer
